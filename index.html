<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.14.2/sql-wasm.js"></script>
<script>
const statusEl = document.getElementById('status');
const resultsWrap = document.getElementById('results-wrap');
const sqlInput = document.getElementById('sql-input');

const SHEET_ID = '1bcPGhOHHrW3By35u8OmPeBy8fLt0rd1yZN9VrAKL2jM';
// Tab names = table names. Add/remove/rename here to match your sheet tabs.
const TABLE_TABS = ['ingredient_actuals', 'ingredient_forecasts'];
const QUESTIONS_TAB = 'questions'; // tab with columns: label, text

let tableSpecs = {};
let db;

function csvUrl(sheetName) {
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}&_=${Date.now()}`;
}

function parseCsv(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r') { /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => v !== ''));
}

function inferType(values) {
  let allInt = true, allReal = true, sawValue = false;
  for (const v of values) {
    if (v === '' || v === null || v === undefined) continue;
    sawValue = true;
    const t = v.trim();
    if (!/^-?\d+$/.test(t)) allInt = false;
    if (!/^-?\d+(\.\d+)?$/.test(t)) allReal = false;
  }
  if (!sawValue) return 'TEXT';
  if (allInt) return 'INTEGER';
  if (allReal) return 'REAL';
  return 'TEXT';
}

function coerce(value, type) {
  if (value === '' || value === undefined || value === null) return null;
  if (type === 'INTEGER') { const n = parseInt(value, 10); return Number.isNaN(n) ? null : n; }
  if (type === 'REAL') { const n = parseFloat(value); return Number.isNaN(n) ? null : n; }
  return value;
}

function escapeHtml(v) {
  if (v === null || v === undefined) return '';
  return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

async function fetchCsv(sheetName) {
  const res = await fetch(csvUrl(sheetName));
  if (!res.ok) throw new Error('Failed to fetch tab "' + sheetName + '": ' + res.status);
  return parseCsv(await res.text());
}

async function loadTableTab(name) {
  const csvRows = await fetchCsv(name);
  const header = csvRows[0];
  const dataRows = csvRows.slice(1);
  const types = header.map((_, i) => inferType(dataRows.map(r => r[i])));
  const rows = dataRows.map(r => header.map((_, i) => coerce(r[i], types[i])));
  return { columns: header, types, rows };
}

async function loadQuestionsTab() {
  const csvRows = await fetchCsv(QUESTIONS_TAB);
  const header = csvRows[0].map(h => h.toLowerCase().trim());
  const labelIdx = header.indexOf('label');
  const textIdx = header.indexOf('text');
  return csvRows.slice(1).map(r => ({
    label: labelIdx !== -1 ? r[labelIdx] : '',
    text: textIdx !== -1 ? r[textIdx] : r[r.length - 1]
  }));
}

function renderQuestions(questions) {
  const container = document.getElementById('questions-card');
  let html = '<h2 class="section-title">Exercise questions</h2>';
  questions.forEach(function(q, i) {
    html += '<div class="question-block"' + (i === questions.length - 1 ? ' style="margin-bottom:0;"' : '') + '>';
    html += '<p class="qlabel">' + escapeHtml(q.label || ('Question ' + (i + 1))) + '</p>';
    html += '<p class="qtext">' + escapeHtml(q.text) + '</p>';
    html += '</div>';
  });
  container.innerHTML = html;
}

function renderSchema() {
  const container = document.getElementById('schema');
  let html = '';
  Object.keys(tableSpecs).forEach(function(name) {
    const spec = tableSpecs[name];
    html += '<div class="table-block"><div class="tname">' + name + '</div>';
    html += '<div class="trow-count">' + spec.rows.length + ' rows</div>';
    html += '<div class="col-list">';
    spec.columns.forEach(function(c, i) {
      html += escapeHtml(c) + ' <span class="type">' + spec.types[i] + '</span><br>';
    });
    html += '</div></div>';
  });
  container.innerHTML = html;
}

function renderResults(result) {
  if (!result) {
    resultsWrap.innerHTML = '<p style="font-size:13px;color:#888;margin:0;">Query ran, no rows returned.</p>';
    return;
  }
  const cap = 1000;
  const rows = result.values.slice(0, cap);
  let html = '<table class="results"><thead><tr><th>#</th>';
  result.columns.forEach(function(c) { html += '<th>' + escapeHtml(c) + '</th>'; });
  html += '</tr></thead><tbody>';
  rows.forEach(function(r, i) {
    html += '<tr><td style="color:#999;">' + (i + 1) + '</td>' + r.map(function(v){ return '<td>' + escapeHtml(v) + '</td>'; }).join('') + '</tr>';
  });
  html += '</tbody></table>';
  if (result.values.length > cap) {
    html += '<p style="font-size:12px;color:#888;padding:8px;">Showing first ' + cap + ' of ' + result.values.length + ' rows.</p>';
  }
  resultsWrap.innerHTML = html;
}

function runQuery() {
  if (!db) {
    statusEl.textContent = 'Still loading the SQL engine - try again in a second.';
    statusEl.className = 'status error';
    return;
  }
  const sql = sqlInput.value.trim();
  if (!sql) {
    statusEl.textContent = 'Enter a query first.';
    statusEl.className = 'status error';
    return;
  }
  try {
    const t0 = performance.now();
    const results = db.exec(sql);
    const t1 = performance.now();
    if (results.length === 0) {
      renderResults(null);
      statusEl.textContent = 'Query ran in ' + Math.round(t1 - t0) + 'ms - no result set.';
      statusEl.className = 'status';
    } else {
      const last = results[results.length - 1];
      renderResults(last);
      statusEl.textContent = last.values.length + ' rows in ' + Math.round(t1 - t0) + 'ms.';
      statusEl.className = 'status';
    }
  } catch (err) {
    statusEl.textContent = err.message;
    statusEl.className = 'status error';
  }
}

async function buildDb() {
  const SQL = await initSqlJs({ locateFile: f => 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.14.2/' + f });
  const newDb = new SQL.Database();
  Object.keys(tableSpecs).forEach(function(name) {
    const spec = tableSpecs[name];
    const colDefs = spec.columns.map(function(c, i) { return '"' + c + '" ' + spec.types[i]; }).join(', ');
    newDb.run('CREATE TABLE "' + name + '" (' + colDefs + ');');
    const placeholders = spec.columns.map(function() { return '?'; }).join(',');
    newDb.run('BEGIN TRANSACTION;');
    const stmt = newDb.prepare('INSERT INTO "' + name + '" VALUES (' + placeholders + ')');
    spec.rows.forEach(function(r) { stmt.run(r); });
    stmt.free();
    newDb.run('COMMIT;');
  });
  return newDb;
}

async function init() {
  statusEl.textContent = 'Pulling latest data from Google Sheets...';
  document.getElementById('run-btn').disabled = true;
  try {
    const specs = {};
    for (const name of TABLE_TABS) {
      specs[name] = await loadTableTab(name);
    }
    tableSpecs = specs;
    renderQuestions(await loadQuestionsTab());
    db = await buildDb();
    renderSchema();
    document.getElementById('run-btn').disabled = false;
    statusEl.textContent = '';
  } catch (err) {
    statusEl.textContent = 'Failed to load data: ' + err.message;
    statusEl.className = 'status error';
  }
}

document.getElementById('run-btn').addEventListener('click', runQuery);
sqlInput.addEventListener('keydown', function(e) {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); runQuery(); }
});
init();
</script>
